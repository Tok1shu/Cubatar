<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cubatar 3D viewer</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="viewer"></canvas>
<script src="https://cdn.jsdelivr.net/npm/skinview3d@3/bundles/skinview3d.bundle.js"></script>
<script>
  // Имя/UUID/base64-URL берём из пути страницы (/view/{input}) на клиенте и
  // подставляем только через encodeURIComponent - сервер ничего не шаблонизирует
  // в HTML, поэтому XSS через input невозможен by design.
  const params = new URLSearchParams(location.search);
  const flag = (name, def) => params.has(name) ? params.get(name) !== "false" : def;

  const input = decodeURIComponent(location.pathname.replace(/\/+$/, "").split("/").pop());

  const viewer = new skinview3d.SkinViewer({
    canvas: document.getElementById("viewer"),
    width: innerWidth,
    height: innerHeight,
    fov: parseFloat(params.get("fov") || "40"),
    zoom: parseFloat(params.get("zoom") || "0.9"),
  });

  // ?model=slim|classic - явное указание модели, иначе автоопределение
  const model = ({ slim: "slim", alex: "slim", classic: "default", steve: "default", wide: "default" })
      [(params.get("model") || "").toLowerCase()] || "auto-detect";
  viewer.loadSkin("/v1/skin/" + encodeURIComponent(input), { model });

  // Плащ (если есть): ?cape=false - скрыть, ?elytra=true - носить как элитры.
  // 404 от /v1/cape просто гасим - значит, плаща у игрока нет.
  if (flag("cape", true)) {
    viewer.loadCape("/v1/cape/" + encodeURIComponent(input), {
      backEquipment: flag("elytra", false) ? "elytra" : "cape",
    }).catch(() => {});
  }

  if (flag("walk", true)) {
    viewer.animation = new skinview3d.WalkingAnimation();
    viewer.animation.speed = 0.6;
    // ?headbob=false - зафиксировать голову, не все хотят, чтобы игрок ей вертел
    viewer.animation.headBobbing = flag("headbob", true);
  }
  viewer.autoRotate = flag("rotate", true);
  viewer.autoRotateSpeed = 0.7;
  // Колёсико по умолчанию не перехватываем - в iframe посреди страницы это бесит
  viewer.controls.enableZoom = flag("wheelzoom", false);

  // ?yaw / ?pitch (градусы, как у /v1/iso) - фиксированный ракурс камеры, 0/0 = спереди
  if (params.has("yaw") || params.has("pitch")) {
    const azimuth = parseFloat(params.get("yaw") || "0") * Math.PI / 180;
    const polar = (90 - parseFloat(params.get("pitch") || "0")) * Math.PI / 180;
    const radius = viewer.camera.position.length();
    viewer.camera.position.set(
      radius * Math.sin(polar) * Math.sin(azimuth),
      radius * Math.cos(polar),
      radius * Math.sin(polar) * Math.cos(azimuth),
    );
  }
  viewer.controls.update();

  // ?vrotate=false - запретить вращение по вертикали (только горизонталь)
  if (!flag("vrotate", true)) {
    const polar = viewer.controls.getPolarAngle();
    viewer.controls.minPolarAngle = polar;
    viewer.controls.maxPolarAngle = polar;
  }
  // ?hrotate=false - запретить вращение по горизонтали (только вертикаль)
  if (!flag("hrotate", true)) {
    const azimuth = viewer.controls.getAzimuthalAngle();
    viewer.controls.minAzimuthAngle = azimuth;
    viewer.controls.maxAzimuthAngle = azimuth;
  }

  const bg = params.get("bg");
  if (bg) viewer.background = "#" + bg.replace(/[^0-9a-fA-F]/g, "");

  addEventListener("resize", () => viewer.setSize(innerWidth, innerHeight));
  // Не жжём GPU, когда вкладка в фоне
  document.addEventListener("visibilitychange", () => { viewer.renderPaused = document.hidden; });
</script>
</body>
</html>
